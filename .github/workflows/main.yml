name: Auto Build

# Builds the game on every push to master (and checks pull requests).
# The web build is deployed to GitHub Pages from master only.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: build/package-lock.json

      - name: Export with GDevelop
        working-directory: build
        run: |
          npm ci
          npm run build

      - name: Deploy to GitHub Pages
        if: github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/gdExport
          commit_message: Auto built nightly game build

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            target: --linux AppImage
            files: build/gdExport/dist/*.AppImage
          - os: macos-latest
            name: mac
            target: --mac dmg
            files: build/gdExport/dist/*.dmg
          - os: windows-latest
            name: windows
            target: --win portable
            files: build/gdExport/dist/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: build/package-lock.json

      - name: Export with GDevelop
        working-directory: build
        run: |
          npm ci
          npm run electron-build

      - name: Package Electron app
        working-directory: build/gdExport
        run: |
          npm install
          npx electron-builder ${{ matrix.target }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.files }}
